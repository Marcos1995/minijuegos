<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pong</title>
  <link rel="stylesheet" href="../app.css">
</head>
<body class="play">
  <header>
    <p><a href="../index.html">← Minijuegos</a></p>
    <h1>Pong</h1>
    <p id="status" class="status" aria-live="polite">Arrastra el dedo para mover tu pala.</p>
    <div class="bar">
      <button type="button" id="reset">Nueva partida</button>
    </div>
  </header>
  <main>
    <canvas class="game" id="cv" width="320" height="240" role="img" aria-label="Pong"></canvas>
    <p class="hint">Arrastra arriba y abajo. Teclado: W/S o flechas.</p>
  </main>
  <script src="../js/swipe.js"></script>
  <script src="../js/pong.js"></script>
  <script>
    var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
    var status = document.getElementById("status"), s = Pong.start(), up = false, down = false, dragY = null, t;
    function draw() {
      ctx.fillStyle = "#0b1020";
      ctx.fillRect(0, 0, Pong.W, Pong.H);
      ctx.fillStyle = "#f4efe6";
      ctx.fillRect(0, s.p1, Pong.PW, Pong.PH);
      ctx.fillRect(Pong.W - Pong.PW, s.p2, Pong.PW, Pong.PH);
      ctx.fillRect(s.x, s.y, Pong.BS, Pong.BS);
      status.textContent = s.s1 + " — " + s.s2;
    }
    function loop() {
      Pong.step(s, up, down);
      if (dragY != null) s.p1 = Math.max(0, Math.min(Pong.H - Pong.PH, dragY));
      draw();
      t = requestAnimationFrame(loop);
    }
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") { up = true; e.preventDefault(); }
      if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { down = true; e.preventDefault(); }
    });
    document.addEventListener("keyup", function (e) {
      if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") up = false;
      if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") down = false;
    });
    Swipe.drag(cv, function (p) { dragY = p.y * Pong.H - Pong.PH / 2; });
    document.getElementById("reset").onclick = function () { s = Pong.start(); };
    loop();
  </script>
</body>
</html>
