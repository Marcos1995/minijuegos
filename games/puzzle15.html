<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Puzzle 15</title>
  <link rel="stylesheet" href="../app.css">
</head>
<body class="play">
  <header>
    <p><a href="../index.html">← Minijuegos</a></p>
    <h1>Puzzle 15</h1>
    <p id="status" class="status">Ordena 1–15.</p>
    <div class="bar">
      <button type="button" id="reset">Nueva partida</button>
    </div>
  </header>
  <main>
    <div id="board" class="board-4 puzzle" role="grid" aria-label="Puzzle 15"></div>
    <p class="hint">Desliza o toca una ficha junto al hueco.</p>
  </main>
  <script src="../js/swipe.js"></script>
  <script src="../js/puzzle15.js"></script>
  <script>
    var s = Puzzle15.start();
    var board = document.getElementById("board");
    var status = document.getElementById("status");
    function paint() {
      board.innerHTML = "";
      var legal = {};
      Puzzle15.moves(s).forEach(function (i) { legal[i] = 1; });
      for (var i = 0; i < 16; i++) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "cell";
        b.textContent = s.a[i] ? String(s.a[i]) : "";
        b.disabled = !s.a[i] || Puzzle15.won(s);
        if (!s.a[i]) b.classList.add("hole");
        if (legal[i]) b.classList.add("legal");
        b.onclick = (function (i) { return function () { Puzzle15.slide(s, i); paint(); }; })(i);
        board.appendChild(b);
      }
      status.textContent = Puzzle15.won(s) ? "Ordenado." : "Desliza o toca una ficha junto al hueco.";
    }
    var swiped = false;
    Swipe.on(board, function (ev) {
      if (ev.type !== "swipe") return;
      swiped = true;
      var h = s.a.indexOf(0);
      var t = { L: h + 1, R: h - 1, U: h + 4, D: h - 4 }[ev.dir];
      Puzzle15.slide(s, t);
      paint();
    });
    board.addEventListener("click", function (e) {
      if (!swiped) return;
      e.preventDefault();
      e.stopPropagation();
      swiped = false;
    }, true);
    document.getElementById("reset").onclick = function () { s = Puzzle15.start(); paint(); };
    paint();
  </script>
</body>
</html>
